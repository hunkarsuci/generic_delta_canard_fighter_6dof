name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Check installed dependencies
        run: python -m pip check

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite with coverage
        run: |
          python -m pytest \
            --cov=generic_delta_canard_fighter_6dof \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -q

  smoke-tests:
    name: Simulation smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run deterministic evaluation
        run: python examples/evaluate_6dof.py --state-only

      - name: Check trim, linearization, and controllers
        run: |
          python - <<'PY'
          import numpy as np

          from generic_delta_canard_fighter_6dof.control import (
              AircraftPID,
              compute_lqr,
          )
          from generic_delta_canard_fighter_6dof.geometry import (
              create_default_geometry,
          )
          from generic_delta_canard_fighter_6dof.linearization import linearize
          from generic_delta_canard_fighter_6dof.propulsion import (
              combined_forces_moments,
          )
          from generic_delta_canard_fighter_6dof.state import make_state
          from generic_delta_canard_fighter_6dof.trim import trim_straight_level

          trim = trim_straight_level(5000, 200)
          assert trim.converged, f"Trim failed: {trim.message}"

          linear_model = linearize(
              trim.state,
              trim.control,
              create_default_geometry(),
              combined_forces_moments(),
          )
          assert linear_model.A.shape == (12, 12)

          pid_output = AircraftPID().step(
              make_state(VT=200),
              np.array([0, 0, 0, 200]),
              0.01,
          )
          assert pid_output.shape == (4,)

          lqr = compute_lqr(linear_model.A, linear_model.B)
          assert lqr.stabilizable
          assert lqr.K.shape == (5, 12)

          print(
              f"Smoke checks passed: alpha={trim.alpha_deg:.3f} deg, "
              f"throttle={trim.throttle:.4f}, LQR K={lqr.K.shape}"
          )
          PY
