name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Run tests with coverage
        run: python -m pytest --cov=generic_delta_canard_fighter_6dof --cov-report=term-missing -q

      - name: Deterministic evaluation
        run: python examples/evaluate_6dof.py --state-only

      - name: Trim baseline
        run: python -c "from generic_delta_canard_fighter_6dof.trim import trim_straight_level; r = trim_straight_level(5000, 200); assert r.converged, f'Trim failed: {r.message}'; print(f'alpha={r.alpha_deg:.3f}deg, throttle={r.throttle:.4f}')"

      - name: Linearization baseline
        run: python -c "from generic_delta_canard_fighter_6dof.trim import trim_straight_level; from generic_delta_canard_fighter_6dof.linearization import linearize; from generic_delta_canard_fighter_6dof.propulsion import combined_forces_moments; from generic_delta_canard_fighter_6dof.geometry import create_default_geometry; r = trim_straight_level(5000, 200); assert r.converged; lin = linearize(r.state, r.control, create_default_geometry(), combined_forces_moments()); assert lin.A.shape == (12, 12); print('Linearization OK')"

      - name: PID controller baseline
        run: python -c "from generic_delta_canard_fighter_6dof.control import AircraftPID; from generic_delta_canard_fighter_6dof.state import make_state; import numpy as np; pid = AircraftPID(); out = pid.step(make_state(VT=200), np.array([0,0,0,200]), 0.01); assert out.shape == (4,); print('PID OK')"

      - name: LQR controller baseline
        run: python -c "from generic_delta_canard_fighter_6dof.trim import trim_straight_level; from generic_delta_canard_fighter_6dof.linearization import linearize; from generic_delta_canard_fighter_6dof.control import compute_lqr; from generic_delta_canard_fighter_6dof.propulsion import combined_forces_moments; from generic_delta_canard_fighter_6dof.geometry import create_default_geometry; r = trim_straight_level(5000, 200); assert r.converged; lin = linearize(r.state, r.control, create_default_geometry(), combined_forces_moments()); lqr = compute_lqr(lin.A, lin.B); assert lqr.stabilizable; print(f'LQR OK, K shape={lqr.K.shape}')"
